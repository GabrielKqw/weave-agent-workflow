description = "Generate a plain-text task brief for Claude, Gemini, or Codex (weave prompt)"
prompt = "Generate a ready-to-paste Weave task brief with the arguments: {{args}}. Call the Weave MCP `prompt` tool when available (the first argument may be claude, gemini, or codex; the rest is the task), otherwise run `weave prompt {{args}}`. With no task, use .weave/state.md. Treat the generated text as a scaffold: inspect relevant repository entry points and state, then replace generic text with the actual objective, concrete acceptance checks, confirmed paths and constraints, and the first useful action. Check any saved plan against the current request. Distinguish facts from assumptions; ask only if missing information blocks a correct brief. Return only the finished Markdown brief, without XML."
