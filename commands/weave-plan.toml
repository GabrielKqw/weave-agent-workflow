description = "Plan a task before coding: contract, steps, saved to .weave/state.md"
prompt = "Plan this task without editing source files: {{args}}. Read .weave/state.md first if it exists. Trace the affected flow from its entry point, then write the contract (Goal, Constraints, Not requested, Completion criteria, Blocking questions) and an ordered plan where each step names the file, the change, and how it is verified. Prefer reuse, stdlib, native features, and the shared fix point. Save it all to .weave/state.md and end with: Saved to .weave/state.md. Approve to build, or adjust."
